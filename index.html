<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b12" />
    <meta
      name="description"
      content="A local-first study workspace: notes, calendar and board, kept in your browser."
    />
    <title>Cuervo Planner</title>
    <script>
      // Paints the chosen look before the bundle loads, so a dark theme never flashes light.
      // Mirrors applyPreferencesToDocument() in src/lib/preferences/preferences-cache.ts, which takes over.
      (function () {
        var root = document.documentElement;
        var prefs = {};
        try {
          var raw = localStorage.getItem("cuervo-preferences");
          var legacy = localStorage.getItem("theme");
          prefs = raw ? JSON.parse(raw) || {} : legacy ? { theme: legacy } : {};
        } catch (error) {
          prefs = {};
        }
        var mode = prefs.theme || "system";
        var systemDark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = mode === "system" ? (systemDark ? "dark" : "light") : mode;
        var dark = theme === "dark" || theme === "oled";
        root.dataset.theme = theme;
        root.dataset.accent = prefs.accent || "rose";
        root.dataset.density = prefs.density || "comfortable";
        root.dataset.fontSize = prefs.fontSize || "md";
        root.classList.toggle("dark", dark);
        root.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
