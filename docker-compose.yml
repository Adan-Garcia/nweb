# The backend and the Postgres it needs, for running the app against a server locally.
# Secrets come from `.env` (git-ignored); compose refuses to start without them rather than
# inventing one, because SERVER_SECRET must survive a restart (server/CLAUDE.md §5).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: engine
      POSTGRES_DB: engine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - engine-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engine -d engine"]
      interval: 2s
      timeout: 3s
      retries: 15

  server:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://engine:${POSTGRES_PASSWORD}@db:5432/engine
      SERVER_SECRET: ${SERVER_SECRET:?set SERVER_SECRET in .env (16+ characters)}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      # Optional; all three or none. Without them the server sends no reminders.
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    ports:
      - "127.0.0.1:8787:8787"
    restart: unless-stopped

volumes:
  engine-db:
