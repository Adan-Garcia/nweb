# The server (which also serves the app), the Postgres it needs, and optionally a Cloudflare
# Tunnel that puts it on the internet without opening a port: `docker compose --profile
# tunnel up -d --build`. docs/deploy.md walks through it.
# Secrets come from `.env` (git-ignored); compose refuses to start without them rather than
# inventing one, because SERVER_SECRET must survive a restart (server/CLAUDE.md §5).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: engine
      POSTGRES_DB: engine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - engine-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engine -d engine"]
      interval: 2s
      timeout: 3s
      retries: 15

  server:
    # Built here with `--build`; otherwise the image CI publishes, which `docker compose
    # pull` fetches (docs/deploy.md). ENGINE_IMAGE pins a version, e.g. :sha-<commit>.
    image: ${ENGINE_IMAGE:-ghcr.io/adan-garcia/nweb:latest}
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://engine:${POSTGRES_PASSWORD}@db:5432/engine
      SERVER_SECRET: ${SERVER_SECRET:?set SERVER_SECRET in .env (16+ characters)}
      # Only needed for an app served from somewhere else (your own site): list its origin.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      # Behind the tunnel every request arrives from cloudflared; this is where the caller's
      # own address is. Leave it empty if nothing proxies the server.
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      # Comma-separated. Empty means anyone who can reach the server may register.
      REGISTRATION_EMAILS: ${REGISTRATION_EMAILS:-}
      # Optional; all three or none. Without them the server sends no reminders.
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    ports:
      - "127.0.0.1:8787:8787"
    restart: unless-stopped

  # Off unless asked for (`--profile tunnel`). The tunnel's public hostname is pointed at
  # http://server:8787 in the Cloudflare dashboard; nothing here listens publicly.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - server
    restart: unless-stopped

volumes:
  engine-db:
