name: Docker image

# Publishes the image the Dockerfile builds — the server with the app beside it — to the
# GitHub Container Registry as ghcr.io/<owner>/<repo>. Every push to master is `latest`
# plus its commit; a `v1.2.3` tag also becomes `1.2.3` and `1.2`. docs/deploy.md says how a
# server pulls it instead of building.
on:
  push:
    branches: [master]
    tags: ["v*"]
  # A pull request builds the image without publishing it, so a Dockerfile that no longer
  # builds is caught before it reaches master.
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
      - package.json
      - package-lock.json
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only what pushing to this repository's own package needs; GITHUB_TOKEN does it,
      # so there is no registry secret to store or rotate.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Registry names must be lower-case; the action lower-cases the owner for us.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
